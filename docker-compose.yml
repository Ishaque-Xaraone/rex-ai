version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rex_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rex_secure_password_placeholder}
      POSTGRES_DB: ${DB_NAME:-rex_ai}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rex_user} -d ${DB_NAME:-rex_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runner
    container_name: rex-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-rex_user}
      - DB_PASSWORD=${DB_PASSWORD:-rex_secure_password_placeholder}
      - DB_NAME=${DB_NAME:-rex_ai}
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-runner
    container_name: rex-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - backend

  ai-service:
    build:
      context: ./AI-Service
      dockerfile: Dockerfile
    container_name: rex-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEFAULT_PROVIDER=mock

volumes:
  pgdata:
    driver: local
